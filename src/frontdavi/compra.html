<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAT 416 — Explore</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           CONFIGURAÇÕES GERAIS
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #0b111e;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================================
           ÁREA PRINCIPAL DA ANIMAÇÃO

           Quanto maior esse valor,
           mais tempo o usuário terá para fazer o scroll.
        ===================================================== */

        .explore-section {

            height: 100vh;

            position: relative;

        }


        

        .scene {

            position: sticky;

            top: 0;

            width: 100%;

            height: 100vh;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* =====================================================
           FUNDO DECORATIVO
        ===================================================== */

        .background-glow {

            position: absolute;

            width: 700px;

            height: 700px;

            border-radius: 50%;

            background: radial-gradient(
                circle,
                rgba(247, 187, 8, 0.986),
                transparent 70%
            );

            pointer-events: none;

        }


        /* =====================================================
           TRATOR
        ===================================================== */

        #tractor-container {

            position: absolute;

            width: min(900px, 75vw);

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(1);

            will-change: transform;

        }


        #tractor {

            width: 100%;

            height: auto;

            display: block;

            /*
                A imagem original tem fundo branco.

                Por enquanto vamos usar ela normalmente.
            */

        }


        .tractor-image {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: auto;

            display: block;

            opacity: 0;

            transition: opacity 0.5s ease;

            pointer-events: none;

        }


        .tractor-image:first-child {

            position: relative;

        }


        .tractor-image.active {

            opacity: 1;

        }




        .background-glow {

            animation: glowAnimation 4s ease-in-out infinite;

        }


        @keyframes glowAnimation {

            0%, 100% {
                transform: scale(0.9);
                opacity: 0.65;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }

        }


        .qr-code {

            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            padding: 8px;
            background: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;

        }


        .qr-code:hover {

            transform: scale(1.12);
            box-shadow: 0 0 30px rgba(247, 187, 8, 0.75);

        }


        /* =====================================================
           TEXTOS
        ===================================================== */

        .info {

            position: absolute;

            width: 350px;

            z-index: 10;

            pointer-events: none;

        }


        .info-left {

            left: 7%;

            top: 50%;

            transform: translateY(-50%);

        }


        .info-right {

            right: 7%;

            top: 50%;

            transform: translateY(-50%);

        }


        .info-content {

            position: absolute;

            width: 350px;

            opacity: 0;

            transform: translateY(30px);

            transition:
                opacity 0.5s ease,
                transform 0.6s ease;

        }


        .info-content.active {

            opacity: 1;

            transform: translateY(0);

        }


        .tag {

            font-size: 12px;

            letter-spacing: 4px;

            font-weight: bold;

            margin-bottom: 15px;

            opacity: 0.7;

        }


        .info h1 {

            font-size: clamp(45px, 5vw, 75px);

            line-height: 0.95;

            font-weight: 700;

            margin-bottom: 25px;

        }


        .info h2 {

            font-size: clamp(40px, 4vw, 60px);

            line-height: 0.95;

            font-weight: 700;

            margin-bottom: 20px;

        }


        .info p {

            color: #aab3c2;

            line-height: 1.7;

            font-size: 16px;

        }


        /* =====================================================
           INDICADOR DE SCROLL
        ===================================================== */

        .scroll-indicator {

            position: absolute;

            bottom: 35px;

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;

            opacity: 0.6;

            z-index: 20;

        }


        .scroll-indicator span {

            font-size: 10px;

            letter-spacing: 4px;

        }


        .scroll-line {

            width: 1px;

            height: 50px;

            background: white;

            animation: scrollAnimation 1.5s infinite;

        }


        @keyframes scrollAnimation {

            0% {

                transform: scaleY(0);

                transform-origin: top;

            }

            50% {

                transform: scaleY(1);

                transform-origin: top;

            }

            100% {

                transform: scaleY(0);

                transform-origin: bottom;

            }

        }


        /* =====================================================
           SEÇÃO FINAL
        ===================================================== */

        .final-section {

            height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        .final-section h2 {

            font-size: clamp(38px, 5vw, 70px);

            line-height: 0.9;

            transform: translateY(-25px);

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            #tractor-container {

                width: 120vw;

            }


            .info {

                width: 260px;

            }


            .info-left {

                left: 20px;

            }


            .info-right {

                right: 20px;

            }


            .info-content {

                width: 260px;

            }


            .info h1 {

                font-size: 42px;

            }


            .info h2 {

                font-size: 38px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         SEÇÃO DO EXPLODED VIEW
    ====================================================== -->

    <section class="explore-section">


        <!-- CENA FIXA -->

        <div class="scene">


            <!-- LUZ DE FUNDO -->

            <div class="background-glow"></div>


            <!-- =================================================
                 TRATOR
            ================================================== -->

            <div id="tractor-container">

                <!--

                    COLOQUE A IMAGEM DO TRATOR
                    NA MESMA PASTA DESTE HTML

                    COM O NOME:

                    trator.png

                -->

                <img
                    src="/src/imgs/Designer(2).png"
                    id="tractor"
                    class="tractor-image active"
                    alt="Trator CAT 416"
                >

            </div>


            <!-- =================================================
                 INFORMAÇÕES
            ================================================== -->

            <div class="info info-left">


                <!-- INÍCIO -->

                <div
                    id="home"
                    class="info-content active"
                >

                    <div class="tag">
                        CAT 416
                    </div>

                    <h1>
                        Feita para<br>
                        trabalho pesado.
                    </h1>

                    <p>
                        Role para finalizar o pagamento.
                    </p>

                </div>


            </div>



            <div class="scroll-indicator">

                <span>
                    SCROLL
                </span>

                <div class="scroll-line"></div>

            </div>


        </div>

    </section>



    <section class="final-section">

        <div class="container">

            <h2>
                ESCANEIE PARA PAGAR
            </h2>

            <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=NerisMachines-CAT416"
                alt="QR Code para pagamento da CAT 416"
                class="qr-code"
            >

        </div>

    </section>


    <script>

        const tractorContainer =
            document.getElementById("tractor-container");


        function updateAnimation() {

            tractorContainer.style.transform =
                `translate(-50%, -50%) scale(1)`;

        }


        window.addEventListener(
            "resize",
            updateAnimation
        );


        updateAnimation();

    </script>


</body>

</html>
